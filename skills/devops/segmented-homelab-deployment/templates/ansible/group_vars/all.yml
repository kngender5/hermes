opnsense_base_url: "https://172.16.10.1"
opnsense_verify_tls: false
opnsense_api_key: "{{ lookup('env', 'OPNSENSE_API_KEY') }}"
opnsense_api_secret: "{{ lookup('env', 'OPNSENSE_API_SECRET') }}"
opnsense_parent_if: "igb1"
openwrt_transit_ip: "172.16.10.2"
openwrt_metrics_target: "192.168.1.2:9100"

opnsense_vlans:
  - { tag: 1, descr: "mgmt", if_name: "igb1" }
  - { tag: 10, descr: "transit", if_name: "igb1" }

opnsense_static_routes:
  - { network: "10.10.20.0/24", gateway: "172.16.10.2", descr: "to-openwrt-lan" }
  - { network: "10.10.30.0/24", gateway: "172.16.10.2", descr: "to-openwrt-dmz" }
  - { network: "10.10.40.0/24", gateway: "172.16.10.2", descr: "to-openwrt-iot" }

opnsense_outbound_nat_rules:
  - { interface: "wan", source: "10.10.20.0/24", descr: "NAT-LAN" }
  - { interface: "wan", source: "10.10.30.0/24", descr: "NAT-DMZ" }
  - { interface: "wan", source: "10.10.40.0/24", descr: "NAT-IOT" }

proxmox_bridge_iface: "eno1"
proxmox_bridge_name: "vmbr0"
proxmox_bridge_vids: "1 10 20 30 40"

crowdsec_ctid: 205
crowdsec_hostname: "crowdsec-lapi"
crowdsec_ip_cidr: "10.10.20.5/24"
crowdsec_gateway: "10.10.20.1"
crowdsec_template: "local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst"
crowdsec_rootfs: "local-lvm:8"
crowdsec_cores: 2
crowdsec_memory: 1024
crowdsec_net_if: "name=eth0,bridge=vmbr0,tag=20,ip=10.10.20.5/24,gw=10.10.20.1"
crowdsec_bouncer_name: "openwrt-bouncer"
crowdsec_bouncer_key_path: "/etc/pve/priv/openwrt-crowdsec-bouncer.key"

prometheus_config_path: "/etc/prometheus/prometheus.yml"
